name: Publish the tables

# The repository is the host: the same chunks CI verifies are the ones served.
#
# Deployed on any change to `data/`, which in practice means almost never — a
# piece is immutable and the set only grows if the library is regenerated. The
# usual reason this runs is a change to the headers or to this file.

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'wrangler.jsonc'
      - '.github/workflows/pages.yml'
  # For re-deploying without touching the data.
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  publish:
    name: Deploy data/ to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Serving a corrupt chunk is worse than serving none: the consumer
      # rebuilds deals from these tables and would read wrong double-dummy
      # answers that look entirely plausible. The same check CI runs, run again
      # against the tree actually being deployed.
      - name: Verify the chunks before publishing them
        run: scripts/split-zdd.py verify

      # Cloudflare is the only target, so a silent skip would go green having
      # published nothing. Fail outright when the credential is missing, while
      # still letting a fork run the verification above.
      - name: Require the Cloudflare credential
        if: github.repository == 'bridge-craftwork/rpdd-library' && env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "CLOUDFLARE_API_TOKEN is not set, so the tables cannot be published." >&2
          echo "The token needs Account -> Cloudflare Pages -> Edit on this account." >&2
          exit 1

      # A deploy failure is otherwise a bare "Authentication error", which does
      # not distinguish a wrong account from a missing permission.
      - name: Show what the credential can reach
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: npx --yes wrangler@4 pages project list

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy --commit-dirty=true

      # What was published is only useful if it can be read the way the
      # consumer reads it: cross-origin, under COEP. A deploy that succeeded
      # and served the pieces without these headers would look perfectly
      # healthy from here and fail in the browser as a blocked subresource.
      - name: The published headers are the ones the consumer needs
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          set -euo pipefail
          url=https://rpdd-library.pages.dev/zdd/rpdd-000.zdd
          # Pages serves the new deployment at its alias within a few seconds,
          # but not always instantly.
          for attempt in 1 2 3 4 5; do
            headers=$(curl -sSI "$url" || true)
            printf '%s' "$headers" | grep -qi '^access-control-allow-origin' && break
            echo "attempt $attempt: not there yet"
            sleep 10
          done
          printf '%s\n' "$headers"
          printf '%s' "$headers" | grep -qi '^access-control-allow-origin: \*' || {
            echo "No Access-Control-Allow-Origin on a published piece; the app cannot read it." >&2
            exit 1
          }
          printf '%s' "$headers" | grep -qi '^cross-origin-resource-policy: cross-origin' || {
            echo "No Cross-Origin-Resource-Policy; COEP require-corp will block this." >&2
            exit 1
          }
          printf '%s' "$headers" | grep -qi '^cache-control: .*immutable' || {
            echo "Pieces are not being cached as immutable, so every visit refetches." >&2
            exit 1
          }
