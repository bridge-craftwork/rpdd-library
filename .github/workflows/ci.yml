name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  data:
    name: Published tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The chunks are the point of this repository, so a corrupt or truncated
      # one must fail here rather than in someone's browser. This checks each
      # chunk's digest and that they rejoin to the whole file's.
      - name: Verify the chunks
        run: scripts/split-zdd.py verify
